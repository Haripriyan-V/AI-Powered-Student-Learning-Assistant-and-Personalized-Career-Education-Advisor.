version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: disha_postgres
    restart: always
    environment:
      POSTGRES_DB: disha_db
      POSTGRES_USER: disha_user
      POSTGRES_PASSWORD: disha_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disha_backend
    restart: always
    environment:
      DEBUG: "False"
      SECRET_KEY: "production-secret-key-replace-in-real-deployment"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DATABASE_URL: "postgresql://disha_user:disha_password@db:5432/disha_db"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      AI_PROVIDER: "gemini"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "gemini-3.6-flash"
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - media_volume:/app/media

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disha_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_volume:
